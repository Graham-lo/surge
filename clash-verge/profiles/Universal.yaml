  - RULE-SET,APNs,APNs-Proxy
  - DOMAIN-SUFFIX,tradingview.com,TradingView
  - DOMAIN-SUFFIX,tradingview-widget.com,TradingView
  - RULE-SET,Claude,AI服务
  - RULE-SET,AI,AI服务
  - RULE-SET,CommonAI,AI服务
  - RULE-SET,CommonAppleIntelligence,AI服务
