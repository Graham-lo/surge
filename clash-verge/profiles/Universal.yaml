# Node-free Mihomo profile for Clash Verge Rev.
# Add private proxy-providers locally; do not commit subscription URLs.

mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.home.arpa'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

proxy-providers: {}

proxy-groups:
  - name: AI服务
    type: select
    include-all-providers: true
    filter: '(?i)\[AI\]'
    proxies: [DIRECT]
  - name: 日常代理
    type: select
    include-all-providers: true
    filter: '(?i)\[REG\]'
    proxies: [DIRECT]
  - name: Binance
    type: select
    include-all-providers: true
    filter: '(?i)\[BIN\]'
    proxies: [DIRECT]
  - name: Bybit
    type: select
    include-all-providers: true
    filter: '(?i)\[BYB\]'
    proxies: [DIRECT]
  - name: OKX
    type: select
    include-all-providers: true
    filter: '(?i)\[OKX\]'
    proxies: [DIRECT]
  - name: TradingView
    type: select
    include-all-providers: true
    filter: '(?i)\[TV\]'
    proxies: [DIRECT]
  - name: APNs-Proxy
    type: select
    proxies: [日常代理, DIRECT]

rule-providers:
  BinanceDirect: {type: http, behavior: classical, format: yaml, interval: 86400, path: ./rules/BinanceDirect.yaml, url: 'https://raw.githubusercontent.com/Graham-lo/surge/master/clash-verge/rules/BinanceDirect.yaml'}
