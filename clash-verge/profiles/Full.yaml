# Node-free full-routing Mihomo profile for Clash Verge Rev.
# Add private proxy-providers locally; never commit subscription URLs.
# Score-prefixed service tags let automatic groups reproduce the maintained
# routing topology without publishing a server, port, credential or provider.

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - 'any:53'
    - 'tcp://any:53'

# This is a built-in direct alias, not a proxy node. Its [999] score keeps it
# behind private [APNS] candidates when include-all sorts policies by name.
proxies:
  - name: '[999][APNS] DIRECT'
    type: direct
    udp: true

proxy-providers: {}

proxy-groups:
  - name: Binance自动容灾
    type: fallback
    include-all: true
    filter: '(?i)\[BIN\]'
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: true
    timeout: 8000
    empty-fallback: DIRECT
  - name: Binance
    type: select
    include-all: true
    filter: '(?i)\[BIN\]'
    proxies: [Binance自动容灾, DIRECT]
  - name: Bybit自动容灾
    type: fallback
    include-all: true
    filter: '(?i)\[BYB\]'
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: true
    timeout: 8000
    empty-fallback: DIRECT
  - name: Bybit
    type: select
    include-all: true
    filter: '(?i)\[BYB\]'
    proxies: [Bybit自动容灾, DIRECT]
  - name: OKX自动容灾
    type: fallback
    include-all: true
    filter: '(?i)\[OKX\]'
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: true
    timeout: 8000
    empty-fallback: DIRECT
  - name: OKX
    type: select
    include-all: true
    filter: '(?i)\[OKX\]'
    proxies: [OKX自动容灾, DIRECT]
  - name: APNs-Proxy
    type: fallback
    include-all: true
    filter: '(?i)\[APNS\]'
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: true
    timeout: 5000
    empty-fallback: DIRECT
  - name: Apple商店
    type: select
    include-all: true
    filter: '(?i)\[APPLE\]'
    proxies: [DIRECT]
  - name: AI自动容灾
    type: fallback
    include-all: true
    filter: '(?i)\[AI\]'
    url: https://www.gstatic.com/generate_204
    interval: 600
    lazy: true
    timeout: 8000
    empty-fallback: REJECT
  - name: AI服务
    type: select
    include-all: true
    filter: '(?i)\[AI\]'
    proxies: [AI自动容灾]
  - name: TradingView
    type: fallback
    include-all: true
    filter: '(?i)\[TV\]'
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: true
    timeout: 8000
    empty-fallback: REJECT
  - name: 日常代理
    type: url-test
    include-all: true
    filter: '(?i)\[REG\]'
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: true
    timeout: 8000
    tolerance: 100
    empty-fallback: REJECT
  - name: 媒体大流量自动容灾
    type: fallback
    include-all: true
    filter: '(?i)\[MEDIA\]'
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: true
    timeout: 8000
    empty-fallback: REJECT
  - name: 媒体大流量
    type: select
    include-all: true
    filter: '(?i)\[MEDIA\]'
    proxies: [媒体大流量自动容灾, 日常代理]
  - name: Git自动容灾
    type: fallback
    include-all: true
    filter: '(?i)\[GIT\]'
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: true
    timeout: 5000
    empty-fallback: DIRECT
  - name: Git服务
    type: select
    include-all: true
    filter: '(?i)\[GIT\]'
    proxies: [Git自动容灾, DIRECT]

