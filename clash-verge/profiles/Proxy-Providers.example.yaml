# Copy provider entries into Universal.yaml locally.
# Keep the real URLs out of Git. Prefix or rename policies with service tags.
proxy-providers:
  residential-example:
    type: http
    url: REPLACE_WITH_PRIVATE_SUBSCRIPTION_URL
    path: ./proxy_providers/residential.yaml
    interval: 3600
    override:
      additional-prefix: '[AI][001] '
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
      timeout: 8000
  regular-example:
    type: http
    url: REPLACE_WITH_PRIVATE_SUBSCRIPTION_URL
    path: ./proxy_providers/regular.yaml
    interval: 3600
    override:
      additional-prefix: '[REG][BIN][BYB][OKX][TV][001] '
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
      timeout: 8000
