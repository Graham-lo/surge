RULE-SET,https://raw.githubusercontent.com/Graham-lo/surge/master/surge/rules/Binance.list,Binance,no-resolve
RULE-SET,https://raw.githubusercontent.com/Graham-lo/surge/master/surge/rules/BybitDirect.list,DIRECT,no-resolve
